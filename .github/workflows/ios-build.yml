name: iOS build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-build.yml"
      - "bebeu/v2/**"
  workflow_dispatch:

jobs:
  ios-simulator:
    runs-on: macos-26
    defaults:
      run:
        working-directory: bebeu/v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bebeu/v2/package-lock.json
      - run: npm ci
      - run: npm run build:app
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Set iOS permission descriptions
        run: |
          plist="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :NSCameraUsageDescription string 작업 사진을 촬영하기 위해 카메라를 사용합니다.' "$plist"
          /usr/libexec/PlistBuddy -c 'Add :NSPhotoLibraryUsageDescription string 작업 사진을 선택하기 위해 사진 보관함을 사용합니다.' "$plist"
          /usr/libexec/PlistBuddy -c 'Add :NSLocationWhenInUseUsageDescription string 배송 동선과 현재 위치를 표시하기 위해 위치를 사용합니다.' "$plist"
      - name: Build iOS Simulator app without signing
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/bebeu-ios" \
            CODE_SIGNING_ALLOWED=NO \
            build
