<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>배송 지도</title>
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { font: 14px sans-serif; background: #edf1f0; }
    #status { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; color: #293a36; text-align: center; }
    #status[hidden] { display: none; }
    .marker { display: grid; place-items: center; width: 30px; height: 30px; border: 2px solid #fff; border-radius: 50%; background: #124f46; color: white; font-size: 11px; font-weight: bold; box-shadow: 0 2px 6px #0004; }
    .marker.current { background: #1f8fda; } .marker.worker { background: #d45d48; }
  </style>
</head>
<body>
  <div id="map" aria-label="카카오 배송 지도"></div>
  <div id="status" role="status">지도 불러오는 중...</div>
  <script src="/delivery-map.js"></script>
  <script src="/api/kakao-map.js"></script>
</body>
</html>
